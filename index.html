        <h1 style="color: #38BDF8; font-size: 1.8rem; margin-top: 0;">74LS83 Lab — Simulador 3D del sumador binario de 4 bits</h1>
        <p><strong>Universidad Nacional Santiago Antúnez de Mayolo (UNASAM)</strong> · Facultad de Ciencias · Escuela Profesional de Ingeniería de Sistemas e Informática · Cátedra de Sistemas Digitales.</p>
        <p>Esta aplicación interactiva requiere que JavaScript y WebGL estén habilitados para cargar el entorno tridimensional de laboratorio.</p>

        <h2 style="color: #E2E8F0; font-size: 1.3rem; margin-top: 24px;">Circuito Integrado SN74LS83A (DIP-16)</h2>
        <p>Sumador binario completo de 4 bits con lógica de acarreo rápido (look-ahead carry). Polarización canónica: VCC en Pin 5 (+5 V) y GND en Pin 12 (Tierra).</p>
        <p>Disposición canónica de pines:</p>
        <ul>
          <li><strong>Entradas Sumando A:</strong> A0 (Pin 10), A1 (Pin 8), A2 (Pin 3), A3 (Pin 1)</li>
          <li><strong>Entradas Sumando B:</strong> B0 (Pin 11), B1 (Pin 7), B2 (Pin 4), B3 (Pin 16)</li>
          <li><strong>Acarreo Inicial:</strong> C0 / Cin (Pin 13)</li>
          <li><strong>Salidas de Suma:</strong> S0 (Pin 9), S1 (Pin 6), S2 (Pin 2), S3 (Pin 15)</li>
          <li><strong>Acarreo Final:</strong> C4 / Cout (Pin 14)</li>
        </ul>

        <h2 style="color: #E2E8F0; font-size: 1.3rem; margin-top: 24px;">Modos de Laboratorio</h2>
        <ul>
          <li><strong>Circuito Montado:</strong> Protoboard MB-102 completamente ensamblada para operar los 9 bits de entrada (A, B y C0) y verificar la suma bit a bit en tiempo real con desgloses binarios, hexadecimales y decimales.</li>
          <li><strong>Montaje Guiado:</strong> 9 etapas progresivas para que el estudiante ensamble el circuito paso a paso con validación de netlist y reglas de diseño eléctrico.</li>
        </ul>
      </div>
