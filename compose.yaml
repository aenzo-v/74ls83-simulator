services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    environment:
      NODE_ENV: development

    stdin_open: true
    tty: true

volumes:
  node_modules:
